services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
      MYSQL_DATABASE: freelance_manager
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
    depends_on:
      - database

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html:Z
      - vendor_data:/var/www/html/vendor
    environment:
      PHP_DISPLAY_ERRORS: "1"
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: freelance_manager
      DB_USER: root
      DB_PASS: ""
    depends_on:
      - database

  seeder:
    build: .
    volumes:
      - ./:/var/www/html:Z
      - vendor_data:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    command: ["php", "bin/seed.php"]
    restart: "no"

volumes:
  db_data:
  vendor_data:
