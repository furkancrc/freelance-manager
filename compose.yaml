services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
      MYSQL_DATABASE: freelance_manager
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
    depends_on:
      - database

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html:Z
    environment:
      PHP_DISPLAY_ERRORS: "1"
    depends_on:
      - database

volumes:
  db_data:
